name: Qt redesign checks

on:
  push:
    branches: [redesign/juxtopposed-ui]
  pull_request:
    paths:
      - 'modules/gui/qt/**'
      - '.github/workflows/qt-redesign-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qml-components:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install Qt test dependencies
        run: python -m pip install -r modules/gui/qt/tests/redesign/requirements.txt
      - name: Check QML and exercise Qt components
        run: python modules/gui/qt/tests/redesign/verify.py --output "${{ runner.temp }}/qt-redesign"
      - name: Retain diagnostics and component captures
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: qt-redesign-${{ matrix.os }}
          path: ${{ runner.temp }}/qt-redesign
