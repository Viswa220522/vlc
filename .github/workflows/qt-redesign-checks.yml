name: Qt redesign checks

on:
  push:
    branches: [redesign/juxtopposed-ui]
  pull_request:
    paths:
      - 'modules/gui/qt/**'
      - '.github/workflows/qt-redesign-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qml-components:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The native Windows contrib bundle contains Qt 6.8.3.
        qt: ['6.8.3', '6.11.2']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0
      - name: Install Qt test dependencies
        run: python -m pip install "PySide6-Essentials==${{ matrix.qt }}"
      - name: Check QML and exercise Qt components
        run: python modules/gui/qt/tests/redesign/verify.py --output "${{ runner.temp }}/qt-redesign"
      - name: Retain diagnostics and component captures
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: qt-redesign-${{ matrix.os }}-${{ matrix.qt }}
          path: ${{ runner.temp }}/qt-redesign
